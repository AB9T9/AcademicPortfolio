<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--Navbar section -->
    <nav
      class="navbar navbar-expand-lg fixed-top border-bottom"
      style="height: 80px"
    >
      <div class="container">
        <!-- Logo -->
        <a class="navbar-brand" href="#">
          <img
            src="./—Pngtree—letter ab logo template design_5525609.png"
            alt="AB Logo"
            class="logo"
            height="90"
            width="90"
          />
        </a>

        <!-- Mobile Button -->
        <button
          class="navbar-toggler bg-light"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto text-center">
            <li class="nav-item">
              <a class="nav-link px-3" href="#about">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link px-3" href="#education"> Education </a>
            </li>

            <li class="nav-item">
              <a class="nav-link px-3" href="#skills">Skills</a>
            </li>

            <li class="nav-item">
              <a class="nav-link px-3" href="#contact">Contact</a>
            </li>

            <li class="nav-item ms-lg-3 mt-lg-0 d-flex align-items-center">
              <div
                class="form-check form-switch d-flex align-items-center gap-2"
              >
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="themeToggle"
                />
                <label class="form-check-label" for="themeToggle">
                  <img
                    src="./icons8-dark-mode-24.png"
                    alt=""
                    width="18"
                    height="18"
                  />
                </label>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header></header>
    <main></main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
